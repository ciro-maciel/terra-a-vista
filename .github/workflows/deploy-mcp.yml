# Deploy of the map's MCP server (mcp/): the public data as a remote MCP server and the weekly anonymous index, at
# terra-a-vista.mcp.myagents.click. Tests first: the index rules (the minimum of 10, no free text) must hold.

name: Terra à Vista — conector MCP

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: true

jobs:
  worker:
    name: Worker — testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Instalar dependências
        run: bun install --frozen-lockfile
        working-directory: ./mcp
      - name: Testes
        run: bun test
        working-directory: ./mcp
      - name: Publicar
        run: bunx wrangler deploy
        working-directory: ./mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
