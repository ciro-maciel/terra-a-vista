<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terra à Vista — o Brasil como mapa de estratégia</title>
  <meta name="description" content="O Brasil de verdade desenhado como mapa de jogo de estratégia: terreno em hexágonos, cidades, lentes e recursos, tudo de dados públicos.">
  <meta name="theme-color" content="#131e2a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23120d06'/%3E%3Ccircle cx='32' cy='32' r='29' fill='%23c9a45c'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%232a4d8f'/%3E%3Cpath fill='%23f8f0d8' d='M32 14l4.9 11.3 12.2 1.1-9.3 8.1 2.8 12-10.6-6.4-10.6 6.4 2.8-12-9.3-8.1 12.2-1.1z'/%3E%3C/svg%3E">
  <!-- Social cards: crawlers need absolute URLs (og:url, og:image, twitter:image, canonical). -->
  <link rel="canonical" href="https://ciro-maciel.github.io/terra-a-vista/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Terra à Vista">
  <meta property="og:title" content="O Brasil como mapa de jogo de estratégia">
  <meta property="og:description" content="O Brasil de verdade desenhado como mapa de estratégia, feito de dados públicos (IBGE, MapBiomas, ESA WorldCover, Datasus, Inep e mais).">
  <meta property="og:url" content="https://ciro-maciel.github.io/terra-a-vista/">
  <meta property="og:image" content="https://ciro-maciel.github.io/terra-a-vista/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="Mapa do Brasil em hexágonos, no estilo de um jogo de estratégia">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="O Brasil como mapa de jogo de estratégia">
  <meta name="twitter:description" content="O Brasil de verdade desenhado como mapa de estratégia, feito de dados públicos.">
  <meta name="twitter:image" content="https://ciro-maciel.github.io/terra-a-vista/og-image.png">
  <meta name="twitter:image:alt" content="Mapa do Brasil em hexágonos, no estilo de um jogo de estratégia">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="Brasil"><span class="brand-emblem" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" focusable="false"><circle cx="12" cy="12" r="12" fill="#1e8a43"/><path d="M12 3.6 21 12l-9 8.4L3 12z" fill="#f2c318"/><circle cx="12" cy="12" r="4.6" fill="#1f3f8f"/><path d="M7.6 10.9c2.9-.5 6.1.1 8.7 1.6l-.3.9c-2.5-1.4-5.5-2-8.3-1.5z" fill="#fff"/></svg></span><span class="brand-text">Brasil</span></div>
    <div id="yields" class="yields" aria-label="Rendimentos do país"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="Buscar cidades e estados" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Buscar cidades e estados (/ ou Ctrl K)">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Compartilhar esta vista" title="Compartilhar: copiar o link ou baixar uma imagem"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Ajuda do teclado e do mouse" title="Ajuda (?)"></button>
      <button id="btn-pedia" class="btn" aria-label="Abrir o Almanaque" title="O que cada número quer dizer e de onde vem"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="Mapa do Brasil em hexágonos"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Detalhes"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Escolha uma lente"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Legenda da lente"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Lentes do mapa">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Recursos nos hexágonos (R)" title="Mostrar ou esconder os recursos nos hexágonos (R)" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Minimapa: clique para ir até lá" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Mostrar o minimapa"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Resultados da busca" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Compartilhar" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="Relatório do país" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Almanaque">
      <button class="close icon-btn" data-close aria-label="Fechar o Almanaque">✕</button>
      <nav id="pedia-nav" aria-label="Páginas do Almanaque"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">Surveying the land…</div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
